name: Build, Push Docker & Deploy to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  # STAGE 1: Build and Push Docker Image
  build-and-push:
    name: 📦 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAGE 2: Trigger Coolify Deployment (depends on STAGE 1)
  deploy-coolify:
    name: 🚀 Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build-and-push # Ensures deployment runs ONLY if build & push succeeds

    steps:
      - name: Trigger Coolify Deployment Webhook
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          method: 'POST'
          bearerToken: ${{ secrets.COOLIFY_TOKEN }}
